<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat — Ledgerly</title>
  <link rel="stylesheet" href="css/styles.css?v=dark-20261006" />
  <style>
    /* ===== Chat history sidebar ===== */
    .chat-shell { display: flex; height: calc(100vh - 61px); position: relative; }
    .chat-shell .chat-page { flex: 1; min-width: 0; height: 100%; }
    .chat-title { display: flex; align-items: center; gap: 12px; }
    .history-toggle { background: transparent; border: 1px solid var(--border); color: var(--text);
      border-radius: 8px; padding: 5px 10px; cursor: pointer; font: inherit; font-size: 0.85rem; }
    .history-toggle:hover { border-color: var(--primary); color: var(--primary); }

    .history-panel { width: 290px; flex-shrink: 0; display: flex; flex-direction: column;
      background: var(--surface); border-right: 1px solid var(--border); }
    .chat-shell.history-hidden .history-panel { display: none; }
    .history-head { padding: 14px 16px 8px; }
    .history-head h3 { font-size: 0.95rem; }
    .history-actions { display: flex; gap: 8px; padding: 0 16px 10px; }
    .history-actions .btn { flex: 1; }
    .history-search { margin: 0 16px 10px; padding: 8px 10px; border: 1px solid var(--border);
      border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; font-size: 0.85rem; }
    .history-list { flex: 1; overflow-y: auto; padding: 0 10px 12px; display: flex; flex-direction: column; gap: 6px; }
    .history-item { text-align: left; background: transparent; border: 1px solid transparent;
      border-radius: 10px; padding: 9px 10px; color: var(--text); cursor: pointer; font: inherit; }
    .history-item:hover { background: var(--bg); border-color: var(--border); }
    .history-q { font-size: 0.86rem; display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden; }
    .history-meta { display: flex; justify-content: space-between; align-items: center;
      margin-top: 5px; font-size: 0.72rem; color: var(--muted); }
    .history-badge { padding: 1px 8px; border-radius: 999px; font-weight: 600; font-size: 0.68rem; }
    .st-success, .st-confirmed { background: rgba(74, 222, 128, 0.15); color: #4ade80; }
    .st-pending { background: rgba(251, 191, 36, 0.15); color: #fbbf24; }
    .st-failed { background: rgba(248, 113, 113, 0.15); color: #f87171; }
    .history-empty { color: var(--muted); font-size: 0.85rem; text-align: center; padding: 24px 10px; }

    @media (max-width: 900px) {
      .history-panel { position: absolute; z-index: 5; top: 0; bottom: 0; left: 0; box-shadow: var(--shadow); }
    }
  </style>
</head>
<body class="chat-dark">
  <nav class="navbar">
    <a class="brand" href="index.html">Ledger<span>ly</span></a>
    <div class="nav-links">
      <div id="nav-guest" class="nav-links" style="display:flex; gap:10px;">
        <a href="login.html">Login</a>
        <a class="btn btn-primary btn-sm" href="signup.html">Sign up</a>
      </div>
      <div id="nav-authed" class="nav-user" style="display:none;">
        <a href="chat.html" style="color:var(--primary); font-weight:700;">Chat</a>
        <a href="profile.html">Profile</a>
        <div class="nav-user">
          <span id="nav-user-name" class="name">User</span>
          <div id="nav-avatar" class="avatar">U</div>
        </div>
        <a href="#" id="btn-logout" class="btn btn-ghost btn-sm">Logout</a>
      </div>
    </div>
  </nav>

  <div class="chat-shell" id="chat-shell">
  <aside class="history-panel" id="history-panel">
    <div class="history-head"><h3>Query history</h3></div>
    <div class="history-actions">
      <button type="button" class="btn btn-primary btn-sm" id="new-chat">+ New chat</button>
      <button type="button" class="btn btn-ghost btn-sm" id="clear-history">Clear</button>
    </div>
    <input type="search" class="history-search" id="history-search" placeholder="Search past queries…" autocomplete="off" />
    <div class="history-list" id="history-list"></div>
  </aside>

  <div class="chat-page">
    <div class="chat-header">
      <div class="chat-title">
        <button type="button" class="history-toggle" id="history-toggle" aria-label="Show or hide history">☰ History</button>
        <h2>💬 Ledgerly Chat</h2>
      </div>
      <span class="status">● Online</span>
    </div>

    <div class="chat-messages" id="chat-messages">
      <div class="chat-placeholder" id="chat-placeholder">
        <div class="big">🎙️</div>
        <h3>Your voice ledger copilot</h3>
        <p>
          Ask Ledgerly about your business in English, Hindi, or Hinglish.
        </p>
      </div>
    </div>

    <form class="chat-input-bar" id="chat-form">
      <input
        type="text"
        id="chat-input"
        placeholder="Ask something… e.g. Sharma ji ka kitna udhaar hai?"
        autocomplete="off"
        autofocus
      />
      <button type="button" class="btn btn-voice" id="voice-btn" aria-label="Start voice mode">
        🎙️ Voice
      </button>
      <label class="voice-output-toggle" title="Read Ledgerly replies aloud">
        <input type="checkbox" id="voice-output-toggle" />
        <span>🔊 Read replies</span>
      </label>
      <button type="submit" class="btn btn-primary" id="send-btn">Send</button>
    </form>
  </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (!requireAuth()) return;

      const user = getUser();
      const messagesEl = document.getElementById("chat-messages");
      const placeholder = document.getElementById("chat-placeholder");
      const form = document.getElementById("chat-form");
      const input = document.getElementById("chat-input");
      const sendBtn = document.getElementById("send-btn");
      const voiceBtn = document.getElementById("voice-btn");
      const voiceOutputToggle = document.getElementById("voice-output-toggle");
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const voiceMode = Boolean(SpeechRecognition);
      let voiceOutputEnabled = false;
      let recognition = null;
      let isListening = false;

      voiceOutputToggle.addEventListener("change", () => {
        voiceOutputEnabled = voiceOutputToggle.checked;
      });

      if (!voiceMode) {
        voiceBtn.disabled = true;
        voiceBtn.title = "Voice mode is not supported by this browser";
      } else {
        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = true;
        recognition.lang = "en-IN";

        recognition.onstart = () => {
          isListening = true;
          voiceBtn.classList.add("is-listening");
          voiceBtn.textContent = "⏹ Stop";
          voiceBtn.setAttribute("aria-label", "Stop listening");
        };

        recognition.onresult = (event) => {
          let transcript = "";
          for (let index = event.resultIndex; index < event.results.length; index++) {
            transcript += event.results[index][0].transcript;
          }

          input.value = transcript.trim();
        };

        recognition.onerror = (event) => {
          if (event.error !== "aborted") {
            addMessage("Voice input failed: " + event.error, "bot");
          }
        };

        recognition.onend = () => {
          isListening = false;
          voiceBtn.classList.remove("is-listening");
          voiceBtn.textContent = "🎙️ Voice";
          voiceBtn.setAttribute("aria-label", "Start voice mode");
          input.focus();
        };

        voiceBtn.addEventListener("click", () => {
          if (isListening) {
            recognition.stop();
          } else {
            recognition.start();
          }
        });
      }

      async function speakReply(text) {
        if (!voiceMode || !voiceOutputEnabled || !text) return;
        const response = await api("/ai/speak", {
          method: "POST",
          headers: authHeaders(),
          body: JSON.stringify({ text }),
        });
        if (!response.ok || !response.data || !response.data.audio) {
          throw new Error(response.data && response.data.error
            ? response.data.error
            : "Unable to generate voice response");
        }
        const audio = new Audio(
          "data:" + response.data.contentType + ";base64," + response.data.audio
        );
        await audio.play();
      }

      function addMessage(text, who) {
        if (placeholder) placeholder.remove();

        const wrap = document.createElement("div");
        wrap.className = "msg " + who;

        const body = document.createElement("div");
        body.textContent = text;

        const meta = document.createElement("span");
        meta.className = "meta";
        meta.textContent =
          (who === "user" ? (user && user.name ? user.name : "You") : "Ledgerly") +
          " · " +
          new Date().toLocaleTimeString("en-IN", {
            hour: "2-digit",
            minute: "2-digit",
          });

        wrap.appendChild(body);
        wrap.appendChild(meta);
        messagesEl.appendChild(wrap);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function addQueryResult(data) {
        if (!data || !data.sql || !Array.isArray(data.rows)) return;

        const panel = document.createElement("div");
        panel.className = "msg bot";

        const summary = document.createElement("div");
        summary.textContent = `${data.rowCount || data.rows.length} result(s) found`;
        panel.appendChild(summary);

        const sql = document.createElement("code");
        sql.style.display = "block";
        sql.style.marginTop = "10px";
        sql.style.whiteSpace = "pre-wrap";
        sql.textContent = data.sql;
        panel.appendChild(sql);

        if (data.rows.length) {
          const table = document.createElement("table");
          table.style.marginTop = "12px";
          table.style.borderCollapse = "collapse";
          table.style.width = "100%";
          const columns = Object.keys(data.rows[0]);
          const header = table.insertRow();
          columns.forEach((column) => {
            const cell = header.insertCell();
            cell.textContent = column;
            cell.style.fontWeight = "700";
            cell.style.padding = "6px";
            cell.style.textAlign = "left";
          });
          data.rows.forEach((row) => {
            const line = table.insertRow();
            columns.forEach((column) => {
              const cell = line.insertCell();
              cell.textContent = row[column] == null ? "" : String(row[column]);
              cell.style.padding = "6px";
              cell.style.borderTop = "1px solid #e5e7eb";
            });
          });
          panel.appendChild(table);
        }

        if (data.chartType === "bar" && data.chartKey && data.chartValue && data.rows.length) {
          const chart = document.createElement("div");
          chart.style.marginTop = "12px";
          data.rows.slice(0, 10).forEach((row) => {
            const value = Number(row[data.chartValue]);
            if (Number.isNaN(value)) return;
            const label = document.createElement("div");
            label.textContent = `${row[data.chartKey]}: ${value}`;
            label.style.marginTop = "4px";
            const bar = document.createElement("div");
            bar.style.height = "8px";
            bar.style.marginTop = "3px";
            bar.style.background = "var(--primary)";
            bar.style.borderRadius = "4px";
            bar.style.width = `${Math.max(4, Math.min(100, Math.abs(value)))}%`;
            chart.append(label, bar);
          });
          panel.appendChild(chart);
        }

        const meta = document.createElement("span");
        meta.className = "meta";
        meta.textContent = `Ledgerly · ${new Date().toLocaleTimeString("en-IN", {
          hour: "2-digit",
          minute: "2-digit",
        })}`;
        panel.appendChild(meta);
        messagesEl.appendChild(panel);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function addPendingWrite(data, historyId) {
        const panel = document.createElement("div");
        panel.className = "msg bot";
        const text = document.createElement("div");
        text.textContent = `${data.reply || "I am ready to make this database change."} Please confirm:`;
        const sql = document.createElement("code");
        sql.textContent = data.sql;
        sql.style.display = "block";
        sql.style.margin = "10px 0";
        sql.style.whiteSpace = "pre-wrap";
        const confirm = document.createElement("button");
        confirm.className = "btn btn-primary btn-sm";
        confirm.textContent = "Confirm database change";
        confirm.addEventListener("click", async () => {
          confirm.disabled = true;
          confirm.textContent = "Saving…";
          const response = await api("/ai/confirm", {
            method: "POST",
            headers: authHeaders(),
            body: JSON.stringify({ sql: data.sql }),
          });
          if (response.ok) {
            text.textContent = response.data.reply;
            confirm.remove();
            history.push({ role: "assistant", content: response.data.reply });
            updateHistoryStatus(historyId, "CONFIRMED", response.data.reply);
          } else {
            confirm.disabled = false;
            confirm.textContent = "Confirm database change";
            const failure = response.data && response.data.error
              ? response.data.error
              : "The database change failed.";
            addMessage(failure, "bot");
            updateHistoryStatus(historyId, "FAILED", failure);
          }
        });
        panel.append(text, sql, confirm);
        messagesEl.appendChild(panel);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function addPendingAction(data, historyId) {
        const panel = document.createElement("div");
        panel.className = "msg bot";
        const text = document.createElement("div");
        text.textContent = `${data.reply} Total ₹${data.totalAmount}, paid ₹${data.amountPaid}, outstanding ₹${data.outstandingAmount}.`;
        if (data.interpretationNote) {
          text.textContent += ` Note: ${data.interpretationNote}`;
        }
        const phone = document.createElement("input");
        phone.type = "tel";
        phone.placeholder = "Customer phone number";
        phone.style.display = data.needsPhone ? "block" : "none";
        phone.style.margin = "10px 0";
        const address = document.createElement("input");
        address.type = "text";
        address.placeholder = "Address (optional)";
        address.style.display = data.needsPhone ? "block" : "none";
        address.style.margin = "10px 0";
        const confirm = document.createElement("button");
        confirm.className = "btn btn-primary btn-sm";
        confirm.textContent = data.action === "settle_full_outstanding"
          ? "Confirm settlement"
          : "Confirm sale";
        confirm.addEventListener("click", async () => {
          confirm.disabled = true;
          if (data.needsPhone && !phone.value.trim()) {
            confirm.disabled = false;
            addMessage("Please enter the customer's phone number first.", "bot");
            return;
          }
          const response = await api("/ai/confirm", {
            method: "POST",
            headers: authHeaders(),
            body: JSON.stringify({
              action: data.action,
              customerName: data.customerName,
              productName: data.productName,
              quantity: data.quantity,
              totalAmount: data.totalAmount,
              amountPaid: data.amountPaid,
              paymentMethod: data.paymentMethod,
              phone: phone.value.trim(),
              address: address.value.trim(),
            }),
          });
          if (response.ok) {
            text.textContent = response.data.reply +
              ` Outstanding: ₹${response.data.outstandingAmount}.`;
            confirm.remove();
            updateHistoryStatus(historyId, "CONFIRMED", response.data.reply);
          } else {
            confirm.disabled = false;
            if (response.data && response.data.pendingAction) {
              panel.remove();
              addPendingAction(response.data, historyId);
              return;
            }
            const failure = response.data && response.data.error
              ? response.data.error : "The sale could not be recorded.";
            addMessage(failure, "bot");
            updateHistoryStatus(historyId, "FAILED", failure);
          }
        });
        panel.append(text, phone, address, confirm);
        messagesEl.appendChild(panel);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      const history = [];

      // ===== Query history sidebar =====
      const shellEl = document.getElementById("chat-shell");
      const historyListEl = document.getElementById("history-list");
      const historySearchEl = document.getElementById("history-search");
      let searchTimer = null;

      async function saveHistory(entry) {
        try {
          const res = await api("/history", {
            method: "POST",
            headers: authHeaders(),
            body: JSON.stringify(entry),
          });
          loadHistory();
          return res.ok && res.data ? res.data.id : null;
        } catch {
          return null;
        }
      }

      async function updateHistoryStatus(id, status, reply) {
        if (!id) return;
        try {
          await api("/history/" + id, {
            method: "PATCH",
            headers: authHeaders(),
            body: JSON.stringify({ status, reply }),
          });
          loadHistory();
        } catch {
          /* history is optional - never break the chat */
        }
      }

      async function loadHistory() {
        try {
          const q = historySearchEl.value.trim();
          const res = await api("/history" + (q ? "?q=" + encodeURIComponent(q) : ""), {
            headers: authHeaders(),
          });
          if (res.ok && Array.isArray(res.data)) renderHistory(res.data);
        } catch {
          /* ignore */
        }
      }

      function formatWhen(value) {
        const d = new Date(value);
        if (isNaN(d)) return "";
        const time = d.toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit" });
        const now = new Date();
        const yesterday = new Date(now);
        yesterday.setDate(now.getDate() - 1);
        if (d.toDateString() === now.toDateString()) return "Today, " + time;
        if (d.toDateString() === yesterday.toDateString()) return "Yesterday, " + time;
        return d.toLocaleDateString("en-IN", { day: "numeric", month: "short" }) + ", " + time;
      }

      function renderHistory(items) {
        historyListEl.innerHTML = "";
        if (!items.length) {
          const empty = document.createElement("div");
          empty.className = "history-empty";
          empty.textContent = historySearchEl.value.trim()
            ? "No matching queries."
            : "Your questions will appear here.";
          historyListEl.appendChild(empty);
          return;
        }
        items.forEach((item) => {
          const row = document.createElement("button");
          row.type = "button";
          row.className = "history-item";
          row.title = item.generated_sql ? item.generated_sql : "Click to ask again";

          const q = document.createElement("div");
          q.className = "history-q";
          q.textContent = item.question;

          const meta = document.createElement("div");
          meta.className = "history-meta";
          const when = document.createElement("span");
          when.textContent = formatWhen(item.created_at);
          const badge = document.createElement("span");
          badge.className = "history-badge st-" + String(item.status).toLowerCase();
          badge.textContent = item.status;
          meta.append(when, badge);

          row.append(q, meta);
          row.addEventListener("click", () => {
            input.value = item.question;
            input.focus();
            if (window.innerWidth < 900) shellEl.classList.add("history-hidden");
          });
          historyListEl.appendChild(row);
        });
      }

      historySearchEl.addEventListener("input", () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(loadHistory, 250);
      });

      document.getElementById("history-toggle").addEventListener("click", () => {
        shellEl.classList.toggle("history-hidden");
      });

      document.getElementById("new-chat").addEventListener("click", () => {
        history.length = 0;
        messagesEl.innerHTML = "";
        addMessage("New chat started. Ask me anything about your ledger.", "bot");
        input.focus();
      });

      document.getElementById("clear-history").addEventListener("click", async () => {
        if (!window.confirm("Delete all of your saved query history?")) return;
        await api("/history", { method: "DELETE", headers: authHeaders() });
        loadHistory();
      });

      if (window.innerWidth < 900) shellEl.classList.add("history-hidden");

      async function sendMessage(e) {
        e.preventDefault();
        const text = input.value.trim();
        if (!text) return;

        addMessage(text, "user");
        const previousHistory = history.slice(-10);
        history.push({ role: "user", content: text });
        input.value = "";
        sendBtn.disabled = true;

        try {
          const response = await api("/ai/chat", {
            method: "POST",
            headers: authHeaders(),
            body: JSON.stringify({ message: text, history: previousHistory }),
          });
          if (response.status === 401) {
            clearSession();
            window.location.href = "login.html";
            return;
          }
          if (!response.ok || !response.data || !response.data.reply) {
            throw new Error(response.data && response.data.error
              ? response.data.error
              : "Unable to get an AI response");
          }
          const isPending = Boolean(response.data.pendingAction || response.data.pendingWrite);
          const historyId = await saveHistory({
            question: text,
            generatedSql: response.data.sql || null,
            queryType: isPending ? "WRITE" : (response.data.sql ? "READ" : "CHAT"),
            status: isPending ? "PENDING" : "SUCCESS",
            reply: response.data.reply,
          });
          if (response.data.pendingAction) {
            addPendingAction(response.data, historyId);
          } else if (response.data.pendingWrite) {
            addPendingWrite(response.data, historyId);
          } else {
            addMessage(response.data.reply, "bot");
            addQueryResult(response.data);
          }
          if (voiceOutputEnabled && response.data.reply) {
            speakReply(response.data.reply).catch((error) => {
              addMessage("Voice playback failed: " + error.message, "bot");
            });
          }
          history.push({ role: "assistant", content: response.data.reply });
        } catch (error) {
          addMessage("Sorry, I couldn't reach the AI right now. " + error.message, "bot");
          saveHistory({ question: text, queryType: "CHAT", status: "FAILED", reply: error.message });
        } finally {
          sendBtn.disabled = false;
          input.focus();
        }
      }

      form.addEventListener("submit", sendMessage);

      const initialPrompt = new URLSearchParams(window.location.search).get("prompt");
      if (initialPrompt) {
        input.value = initialPrompt;
        input.focus();
      }

      addMessage(
        "Welcome to Ledgerly, " +
          ((user && user.name) || "friend") +
          "!\n\nAsk me anything about your ledger.",
        "bot"
      );

      loadHistory();
    });
  </script>
</body>
</html>
